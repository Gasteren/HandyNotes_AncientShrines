name: Upload to CurseForge

on:
  push:
    branches:
      - main

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create zip
        run: |
          mkdir HandyNotes_AncientShrines
          cp *.lua *.toc HandyNotes_AncientShrines/
          zip -r HandyNotes_AncientShrines.zip HandyNotes_AncientShrines

      - name: Upload to CurseForge
        uses: itsmeow/curseforge-upload@v3
        with:
          token: "${{ secrets.HANDYNOTES_ANCIENTSHRINES }}"
          project_id: "272284"
          game_endpoint: "wow"
          file_path: "HandyNotes_AncientShrines.zip"
          game_versions: "12.0.1"
          release_type: "release"
          display_name: "HandyNotes_AncientShrines - ${{ github.event.head_commit.timestamp }}"
          changelog: "${{ github.event.head_commit.message }}"
          changelog_type: "markdown"